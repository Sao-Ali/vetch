# This rule is not used by the project vetch itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to infrastructure.vetch.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vetch
    app.kubernetes.io/managed-by: kustomize
  name: virtualinferencecluster-viewer-role
rules:
- apiGroups:
  - infrastructure.vetch.io
  resources:
  - virtualinferenceclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infrastructure.vetch.io
  resources:
  - virtualinferenceclusters/status
  verbs:
  - get
