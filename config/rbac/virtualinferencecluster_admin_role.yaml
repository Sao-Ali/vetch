# This rule is not used by the project vetch itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over infrastructure.vetch.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vetch
    app.kubernetes.io/managed-by: kustomize
  name: virtualinferencecluster-admin-role
rules:
- apiGroups:
  - infrastructure.vetch.io
  resources:
  - virtualinferenceclusters
  verbs:
  - '*'
- apiGroups:
  - infrastructure.vetch.io
  resources:
  - virtualinferenceclusters/status
  verbs:
  - get
