# Fedora containerDisk for the first VM boot test. The model value is illustrative.
# This guest can use cloud-init to receive /etc/vetch/config.json.
apiVersion: infrastructure.vetch.io/v1alpha1
kind: VirtualInferenceCluster
metadata:
  name: demo-vm
spec:
  vmCount: 1
  workersPerVM: 2
  model: example/model-v1
  vm:
    guestImage: quay.io/containerdisks/fedora:latest
    cpuCores: 2
    memory: 4Gi
